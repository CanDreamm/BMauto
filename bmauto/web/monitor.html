<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="color-scheme" content="light">
  <title>$title · Мониторинг</title>
  <link rel="stylesheet" href="/monitor-assets/monitor.css?v=$assets">
  <script defer src="/monitor-assets/monitor.js?v=$assets"></script>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><span class="brand"><span class="brand-mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="5" height="5" rx="1" fill="currentColor"/><rect x="9" y="1" width="6" height="5" rx="1" fill="currentColor" opacity=".5"/><rect x="1" y="9" width="5" height="6" rx="1" fill="currentColor" opacity=".5"/><rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor"/></svg></span>BMauto <span class="brand-section">Мониторинг</span></span><span class="read-only"><span aria-hidden="true">◦</span> Только просмотр</span></div></header>
  <nav class="projects" aria-label="Проекты"><div class="projects-inner" id="project-tabs">$projects</div></nav>
  <main>
    <div class="project-heading"><div><h1 id="project-title">$title</h1><p class="project-description">Контент-план и готовность публикаций</p></div><a class="refresh" href="$refresh"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M13 6a5.2 5.2 0 1 0 .2 4M13 2.5V6H9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Обновить</a></div>
    <section class="plan" aria-labelledby="month-title">
      <div class="plan-heading"><h2 id="month-title">$month</h2><div class="update-status" id="update-status" role="status">$updated</div></div>
      <section class="status-legend" aria-label="Значения цветов статуса"><span class="legend-caption">Статусы</span><div class="legend-items">$legend</div></section>
      <p class="scroll-note">Прокрутите таблицу вправо, чтобы увидеть задания →</p>
      <div class="table-scroll"><table><thead><tr><th scope="col">Статус</th><th scope="col">Дата</th><th scope="col">День</th><th scope="col">Задание</th></tr></thead><tbody id="plan-rows">$rows</tbody></table></div>
      <div class="table-footer"><span>Данные из Google Таблицы</span><span>Обновление раз в минуту</span></div>
    </section>
  </main>
  <nav class="months" aria-label="Месяцы контент-плана"><div class="months-inner" id="month-tabs">$tabs</div></nav>
</body>
</html>
